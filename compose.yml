services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mednotify
      POSTGRES_USER: mednotify
      POSTGRES_PASSWORD: mednotify
    ports:
      - '5432:5432'
    volumes:
      - pdsi1_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mednotify -d mednotify']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - pdsi1_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.7
    container_name: traefik
    profiles:
      - dev
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --log.level=INFO
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TRAEFIK_HOST=${TRAEFIK_HOST:-localhost}

  careconnect:
    image: ghcr.io/lucas-mezencio/pdsi1/careconnect:latest
    pull_policy: always
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://mednotify:mednotify@postgres:5432/mednotify?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      NOTIFIER_MODE: ${NOTIFIER_MODE:-dev}
      FIREBASE_CREDENTIALS_FILE: /app/cc-credentials.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.careconnect.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.careconnect.entrypoints=http
      - traefik.http.services.careconnect.loadbalancer.server.port=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${FIREBASE_CREDENTIALS_PATH}:/app/cc-credentials.json:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:8080/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pdsi1_postgres:
  pdsi1_redis:
